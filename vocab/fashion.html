const TOPICS = ['Fast Fashion & Shopping','Impact & Pollution','Policy & Circularity','Materials & Biotech','Verbs','Adjectives & Adverbs','Phrases'];
let activeTopic = 'all';
let flashcardData = [], currentCardIndex = 0;
const flashcardScene = document.getElementById('flashcard-scene');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const speaker = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6h4l5 5V4L7 9H3z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';

function renderFilters(){
  const box = document.getElementById('topic-filters');
  const mk = (key,label,n) => `<button class="filter-btn${key===activeTopic?' active':''}" data-topic="${esc(key)}">${esc(label)}<span class="count">${n}</span></button>`;
  box.innerHTML = mk('all','All Vocabulary',vocabBank.length) +
    TOPICS.map(t => mk(t,t,vocabBank.filter(v=>v.topic===t).length)).join('');
  box.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => filterTopic(b.dataset.topic));
}

function renderGrid(){
  const grid = document.getElementById('grid-view');
  grid.innerHTML = '';
  vocabBank.forEach((item,idx) => {
    const a = document.createElement('article');
    a.className = 'vocab-card';
    a.dataset.idx = idx;
    a.innerHTML = `
      <div class="word-header">
        <div class="word-main"><span class="word">${esc(item.word)}</span>
          <button class="audio-btn" data-idx="${idx}" title="Listen to pronunciation">${speaker}</button></div>
        <div class="meta-info"><span class="phonetic">${esc(item.phonetic)}</span></div>
      </div>
      <div class="word-families"><strong>Word Form:</strong> ${item.form} | <strong>Related:</strong> ${esc(item.forms)}</div>
      <span class="topic-tag">${esc(item.topic)}</span>
      <p class="definition"><strong>Definition:</strong> ${esc(item.def)}</p>
      <p class="translation">${esc(item.translation)}</p>
      <div class="example-box"><span>Example</span><div class="example-text">"${esc(item.example)}"</div></div>`;
    grid.appendChild(a);
  });
  grid.querySelectorAll('.audio-btn').forEach(b => b.onclick = () => playAudio(vocabBank[b.dataset.idx].word.replace(/\s*\(.*?\)\s*/g,'')));
}

function matches(item){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const topicOk = activeTopic==='all' || item.topic===activeTopic;
  const qOk = !q || item.word.toLowerCase().includes(q) || item.translation.toLowerCase().includes(q) || item.def.toLowerCase().includes(q);
  return topicOk && qOk;
}

function applyFilters(){
  let shown = 0;
  document.querySelectorAll('.vocab-card').forEach(c => {
    const ok = matches(vocabBank[c.dataset.idx]);
    c.classList.toggle('hidden', !ok);
    if (ok) shown++;
  });
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
  if (document.getElementById('flashcard-view').style.display === 'flex') {
    flashcardData = vocabBank.filter(matches);
    currentCardIndex = 0;
    updateFlashcardUI();
  }
}

function filterTopic(t){
  activeTopic = t;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.topic===t));
  applyFilters();
}

function switchView(v){
  const grid = document.getElementById('grid-view'), fc = document.getElementById('flashcard-view');
  document.getElementById('btn-grid').classList.toggle('active', v==='grid');
  document.getElementById('btn-flashcards').classList.toggle('active', v!=='grid');
  if (v==='grid'){ grid.style.display='grid'; fc.style.display='none'; applyFilters(); }
  else { grid.style.display='none'; fc.style.display='flex'; document.getElementById('empty').style.display='none';
         flashcardData = vocabBank.filter(matches); currentCardIndex = 0; updateFlashcardUI(); }
}

// --- Audio ---
let voices = [];
if ('speechSynthesis' in window){
  voices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
}
function playAudio(text){
  if (!('speechSynthesis' in window)){ alert("Sorry, your browser doesn't support text-to-speech."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB'; u.rate = .9;
  const names = ['Female','Samantha','Victoria','Zira','Karen','Tessa','Fiona','Moira','Veena'];
  let v = voices.find(x => names.some(n => x.name.includes(n))) ||
          voices.find(x => x.lang.includes('en-GB') && !x.name.includes('Male'));
  if (v) u.voice = v; else u.pitch = 1.3;
  speechSynthesis.speak(u);
}
function playAudioFromCard(e){
  e.stopPropagation();
  playAudio(document.getElementById('fc-word').textContent.replace(/\s*\(.*?\)\s*/g,''));
}

// --- Flashcards ---
function updateFlashcardUI(){
  flashcardScene.classList.remove('is-flipped');
  if (!flashcardData.length){
    document.getElementById('fc-word').textContent = 'No cards';
    ['fc-phonetic','fc-forms','fc-topic','fc-definition','fc-translation'].forEach(id => document.getElementById(id).textContent='');
    document.getElementById('fc-example-container').innerHTML='';
    document.getElementById('fc-counter').textContent='0 / 0';
    document.getElementById('fc-prev').disabled = document.getElementById('fc-next').disabled = true;
    return;
  }
  const d = flashcardData[currentCardIndex];
  setTimeout(() => {
    document.getElementById('fc-word').textContent = d.word;
    document.getElementById('fc-phonetic').textContent = d.phonetic;
    document.getElementById('fc-topic').textContent = d.topic;
    document.getElementById('fc-definition').textContent = d.def;
    document.getElementById('fc-translation').textContent = d.translation;
    document.getElementById('fc-forms').innerHTML = `<strong>Form:</strong> ${d.form} | <strong>Related:</strong> ${esc(d.forms)}`;
    document.getElementById('fc-example-container').innerHTML = `<div class="example-box"><span>Example</span><div class="example-text">"${esc(d.example)}"</div></div>`;
    document.getElementById('fc-counter').textContent = `${currentCardIndex+1} / ${flashcardData.length}`;
    document.getElementById('fc-prev').disabled = currentCardIndex===0;
    document.getElementById('fc-next').disabled = currentCardIndex===flashcardData.length-1;
  }, 150);
}
function flipCard(){ flashcardScene.classList.toggle('is-flipped'); }
function nextCard(){ if (currentCardIndex < flashcardData.length-1){ currentCardIndex++; updateFlashcardUI(); } }
function prevCard(){ if (currentCardIndex > 0){ currentCardIndex--; updateFlashcardUI(); } }
function shuffleCards(){
  for (let i=flashcardData.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [flashcardData[i],flashcardData[j]]=[flashcardData[j],flashcardData[i]]; }
  currentCardIndex = 0; updateFlashcardUI();
}
document.addEventListener('keydown', e => {
  if (document.getElementById('flashcard-view').style.display !== 'flex' || e.target.id==='search') return;
  if (e.key==='ArrowRight') nextCard();
  if (e.key==='ArrowLeft') prevCard();
  if (e.key===' '){ e.preventDefault(); flipCard(); }
});

renderFilters();
renderGrid();
</script>
